apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-deployment
  labels:
    app: python-app-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app-v1
  template:
    metadata:
      labels:
        app: python-app-v1
    spec:
      containers:
        - name: sample-k8s-deployment
          image: sample-k8s-deployment:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: db-config-volume
              mountPath: /opt
              readOnly: true
      volumes:
        - name: db-config-volume
          configMap:
            name: python-config-map
