apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysite

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysite

  template:
    metadata:
      labels:
        app: mysite

    spec:
      containers:
      - name: mysite

        image: docker.io/library/mysite:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 80
